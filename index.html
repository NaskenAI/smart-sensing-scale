    />

    <script>
      // Apply a saved theme before the first paint. With nothing saved, no class is set and
      // the prefers-color-scheme rule in src/index.css applies.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || theme === "light") document.documentElement.classList.add(theme);
      } catch (e) {
        // Storage unavailable: follow the operating system setting.
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
